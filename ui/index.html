<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Rewind</title>
<style>
@font-face { font-family: "Inter"; src: url("Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }

:root {
  --label: #ececee; --secondary: #9c9ca1; --placeholder: #77777c;
  --accent: #0a84ff; --green: #32d74b; --red: #ff453a;
  --input: #3a3a3c; --input-edge: rgba(255,255,255,.1); --separator: rgba(255,255,255,.1);
  --track: rgba(255,255,255,.14); --push: rgba(255,255,255,.13); --push-hover: rgba(255,255,255,.26);
  --hover: rgba(255,255,255,.10); --seg-on: rgba(255,255,255,.24);
  --material: rgba(30,30,32,.74); --menu: rgba(40,40,43,.92);
  --edge: inset 0 0 0 1px rgba(255,255,255,.14);
  --menu-shadow: 0 0 0 1px rgba(0,0,0,.75), inset 0 0 0 1px rgba(255,255,255,.14), 0 12px 36px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.35);
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", sans-serif;
  --sheet: #202022;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --label: #1d1d1f; --secondary: #6e6e73; --placeholder: #a0a0a5;
    --accent: #007aff; --green: #28cd41; --red: #ff3b30;
    --input: #fff; --input-edge: rgba(0,0,0,.16); --separator: rgba(0,0,0,.09);
    --track: rgba(0,0,0,.09); --push: rgba(0,0,0,.06); --push-hover: rgba(0,0,0,.12);
    --hover: rgba(0,0,0,.07); --seg-on: #fff;
    --material: rgba(246,246,248,.72); --menu: rgba(246,246,248,.94); --sheet: #f4f4f6;
    --edge: none;
    --menu-shadow: 0 0 0 1px rgba(0,0,0,.17), 0 12px 36px rgba(0,0,0,.26), 0 1px 3px rgba(0,0,0,.12);
    color-scheme: light;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--material); color: var(--label);
  font: 400 13px/18px var(--font); font-feature-settings: "tnum" 1;
  box-shadow: var(--edge); overflow: hidden;
  user-select: none; -webkit-user-select: none; cursor: default;
}
svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }
button { font: inherit; color: inherit; cursor: default; }

/* ---------- header ---------- */
.head { height: 58px; padding: 0 12px 0 18px; display: flex; align-items: center; gap: 11px; }
.mark { width: 22px; height: 22px; flex: none; }
.mark circle.ring { stroke: var(--secondary); stroke-width: 1.8; }
.mark circle.dot { stroke: none; fill: var(--secondary); }
.mark.on circle.ring { stroke: var(--label); }
.mark.on circle.dot { fill: var(--label); }
.mark.rec circle.ring { stroke: var(--label); }
.mark.rec circle.dot { fill: var(--red); }
.title { flex: 1; min-width: 0; }
.title b { display: block; font-weight: 600; }
.title span { display: block; font-size: 11px; line-height: 15px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 30px; height: 30px; border: 0; border-radius: 7px; background: none; color: var(--secondary); display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--hover); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- actions ---------- */
.actions { padding: 2px 18px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.push { height: 30px; min-width: 96px; padding: 0 14px; border: 0; border-radius: 7px; background: var(--push); white-space: nowrap; }
.push:hover { background: var(--push-hover); }
.push:disabled { opacity: .45; background: var(--push); }
.push.primary, .push.primary:hover { background: var(--accent); color: #fff; }
.push.stop, .push.stop:hover { background: var(--red); color: #fff; }
.push.small { height: 26px; min-width: 0; padding: 0 11px; }
.spacer { flex: 1; }
.inline { display: flex; align-items: center; gap: 9px; color: var(--secondary); }

/* ---------- tabs ---------- */
.sep { height: 1px; background: var(--separator); }
.tabs { display: flex; justify-content: center; padding: 14px 18px 6px; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--track); }
.seg button { height: 24px; padding: 0 12px; border: 0; border-radius: 5px; background: none; color: var(--label); }
.seg button.on { background: var(--seg-on); box-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.18); }

/* ---------- rows ---------- */
.page { padding: 4px 18px 0; }
.row { min-height: 42px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--separator); }
.row:last-of-type { border-bottom: 0; }
.row > .name { flex: 1; min-width: 0; }
.row > .name small { display: block; font-size: 11px; line-height: 15px; color: var(--secondary); }
.row > .value { color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 290px; }
.note { padding: 9px 0 0; font-size: 11px; line-height: 15px; color: var(--secondary); }
.row.tall { padding: 7px 0; }

/* ---------- recordings list ---------- */
.search { display: flex; align-items: center; gap: 8px; height: 30px; margin: 2px 0 6px; padding: 0 10px; border: 1px solid var(--input-edge); border-radius: 7px; background: var(--input); }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.search svg { width: 14px; height: 14px; flex: none; fill: none; stroke: var(--secondary); stroke-width: 1.5; }
.search input { flex: 1; min-width: 0; height: 26px; border: 0; outline: none; background: transparent; font: inherit; color: var(--label); }
.search input::placeholder { color: var(--placeholder); }
.search .icon-btn { width: 20px; height: 20px; }
input.presets { width: 250px; height: 30px; padding: 0 9px; font: inherit; color: var(--label); background: var(--input); border: 1px solid var(--input-edge); border-radius: 6px; outline: none; }
input.presets:focus { border-color: var(--accent); }
.list { height: 200px; overflow-y: auto; margin: 0 -8px; padding: 0 8px; }
.list::-webkit-scrollbar { width: 6px; }
.list::-webkit-scrollbar-thumb { background: var(--track); border-radius: 3px; }
.day { font-size: 11px; line-height: 15px; color: var(--secondary); padding: 8px 0 4px; }
.file { display: flex; align-items: center; gap: 11px; height: 58px; padding: 0 6px; margin: 0 -6px; border-radius: 7px; }
.file:hover, .file:focus-within { background: var(--hover); }
.file img, .file .noimg { width: 80px; height: 45px; border-radius: 4px; flex: none; object-fit: cover; background: var(--track); }
.file .info { flex: 1; min-width: 0; }
.file .info b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file .info span { display: block; font-size: 11px; line-height: 15px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file .acts { display: flex; gap: 2px; opacity: 0; }
.file:hover .acts, .file:focus-within .acts { opacity: 1; }
.file .acts .icon-btn { width: 28px; height: 28px; }
.file .pill { height: 20px; padding: 0 8px; margin-left: 6px; border-radius: 10px; border: 0; font-size: 11px; color: var(--label); background: var(--track); flex: none; display: inline-flex; align-items: center; gap: 4px; }
.file .pill svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.6; transition: transform .15s; }
.file .pill[aria-expanded="true"] svg.chev { transform: rotate(180deg); }
.file .pill .st { color: var(--secondary); }
.file .pill.ok .st { color: var(--green); }
.file .pill.busy .st { color: var(--accent); font-variant-numeric: tabular-nums; }
.file .pill.bad { background: color-mix(in srgb, var(--red) 18%, transparent); }
.file .pill.bad .st { color: var(--red); }
.marks .mstate { display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 11px; line-height: 15px; color: var(--secondary); }
.marks .mstate.bad { color: var(--red); }
.marks .mstate span { flex: 1; min-width: 0; }
.file .info .title { display: flex; align-items: center; min-width: 0; font-size: inherit; line-height: inherit; color: var(--label); overflow: visible; }
.file .info .title b { min-width: 0; }
.marks { margin: 0 0 6px 91px; }
.mrow { display: flex; align-items: center; gap: 8px; height: 40px; }
.mrow img { width: 56px; height: 32px; border-radius: 3px; object-fit: cover; background: var(--track); flex: none; }
.mrow .at { width: 46px; flex: none; font-size: 11px; color: var(--secondary); font-variant-numeric: tabular-nums; }
.mrow input { flex: 1; min-width: 0; height: 26px; padding: 0 7px; font: inherit; color: var(--label); background: transparent; border: 1px solid transparent; border-radius: 5px; outline: none; }
.mrow input:hover { border-color: var(--input-edge); }
.mrow input:focus { border-color: var(--accent); background: var(--input); }
.mrow input::placeholder { color: var(--placeholder); }
.mrow .icon-btn { width: 26px; height: 26px; opacity: 0; }
.mrow:hover .icon-btn, .mrow:focus-within .icon-btn { opacity: 1; }
.timeline .mk { position: absolute; top: 2px; width: 2px; height: 10px; margin-left: -1px; border-radius: 1px; background: var(--orange, #ff9f0a); pointer-events: none; }
.file input { width: 100%; height: 24px; padding: 0 6px; font: inherit; font-weight: 600; color: var(--label); background: var(--input); border: 1px solid var(--accent); border-radius: 5px; outline: none; }
.empty { height: 200px; display: grid; place-items: center; color: var(--secondary); text-align: center; }

/* ---------- trim view ---------- */
#trim { display: none; padding: 0 18px; }
body.trimming .actions, body.trimming .sep, body.trimming .tabs, body.trimming .page { display: none; }
body.trimming #trim { display: block; }
.stage { height: 262px; border-radius: 8px; background: #000; overflow: hidden; display: grid; place-items: center; position: relative; }
.stage video, .stage img { max-width: 100%; max-height: 100%; display: block; }
.stage .wait { position: absolute; color: #9c9ca1; font-size: 12px; }
.timeline { position: relative; height: 34px; margin: 10px 8px 0; cursor: pointer; touch-action: none; }
.timeline .bar { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--track); }
.timeline .sel { position: absolute; top: 14px; height: 6px; background: var(--accent); }
.timeline .playhead { position: absolute; top: 6px; width: 2px; height: 22px; margin-left: -1px; border-radius: 1px; background: var(--label); pointer-events: none; }
.timeline .knob { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.3); cursor: ew-resize; border: 0; padding: 0; }
.timeline .knob:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.times { display: flex; justify-content: space-between; margin: 0 8px; font-size: 11px; line-height: 15px; color: var(--secondary); }
.times b { color: var(--label); font-weight: 600; }
.trimbar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.trimbar .icon-btn { color: var(--label); }
.trimnote { margin-top: 6px; font-size: 11px; line-height: 15px; color: var(--secondary); min-height: 15px; }
.trimnote.bad { color: var(--red); }

/* ---------- switch ---------- */
.switch { width: 34px; height: 20px; border: 0; padding: 0; border-radius: 10px; background: var(--track); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.3); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 16px; }

/* ---------- pop-up button and its menu ---------- */
.popup { height: 26px; max-width: 300px; padding: 0 7px 0 10px; border: 0; border-radius: 7px; background: var(--push); display: inline-flex; align-items: center; gap: 8px; }
.popup:hover, .popup.open { background: var(--push-hover); }
.popup span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popup svg { width: 10px; height: 14px; flex: none; color: var(--secondary); stroke-width: 1.4; }
.menu { position: fixed; z-index: 10; min-width: 120px; max-width: 420px; max-height: 420px; overflow-y: auto; padding: 5px; border-radius: 8px;
  background: var(--menu); box-shadow: var(--menu-shadow); }
.menu::-webkit-scrollbar { width: 0; }
.menu .item { height: 22px; padding: 0 12px 0 21px; border-radius: 4px; display: flex; align-items: center; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu .item span { overflow: hidden; text-overflow: ellipsis; }
.menu .item:hover { background: var(--accent); color: #fff; }
.menu .item svg { position: absolute; left: 4px; top: 5px; width: 12px; height: 12px; stroke-width: 1.7; }
.menu .line { height: 1px; margin: 4px 8px; background: var(--separator); }
.menu .head-item { height: 20px; padding: 0 12px 0 21px; font-size: 11px; color: var(--secondary); display: flex; align-items: center; }
.veil { position: fixed; inset: 0; z-index: 9; }

/* ---------- hotkey field ---------- */
.key { height: 30px; min-width: 150px; padding: 0 9px; border: 1px solid var(--input-edge); border-radius: 6px; background: var(--input); text-align: center; display: inline-flex; align-items: center; justify-content: center; }
.key.empty { color: var(--placeholder); }
.key.listening { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); color: var(--secondary); }
.key.taken { border-color: var(--red); }
.keys .key { width: 132px; min-width: 0; flex: none; }
.keys .key.pad { width: 176px; }
.key > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.key.pad svg { width: 15px; height: 15px; margin-right: 6px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.3; opacity: .7; }
.cols { display: flex; gap: 12px; padding: 6px 0 2px; font-size: 11px; color: var(--secondary); }
.cols span:first-child { flex: 1; }
.cols span:nth-child(2) { width: 132px; text-align: center; }
.cols span:nth-child(3) { width: 176px; text-align: center; }
.bad { color: var(--red); font-size: 11px; }

/* ---------- source picker: live pictures of displays and windows ---------- */
.picker { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--sheet); }
.picker-head { flex: none; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px 0 18px; border-bottom: 1px solid var(--separator); }
.picker-head b { flex: 1; font-weight: 600; }
.picker-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 18px; }
.picker-body::-webkit-scrollbar { width: 6px; }
.picker-body::-webkit-scrollbar-thumb { background: var(--track); border-radius: 3px; }
.picker h3 { margin: 12px 0 8px; font-size: 11px; font-weight: 600; color: var(--secondary); }
.picker .grid { display: grid; gap: 10px; }
.picker .grid.screens { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.picker .grid.windows { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.src { display: flex; flex-direction: column; gap: 6px; padding: 6px; border: 0; border-radius: 9px; background: none; text-align: left; min-width: 0; }
.src:hover { background: var(--hover); }
.src .pic { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--track); display: grid; place-items: center; }
.src .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--track); }
.src .pic span { font-size: 11px; color: var(--secondary); }
.src .cap { font-size: 12px; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.src.on .pic { box-shadow: 0 0 0 2px var(--accent); }
.src.on .cap { font-weight: 600; }
html[data-skin="play"] .picker { background: #111218; backdrop-filter: none; }
html[data-skin="play"] .picker-head { height: auto; padding: 16px 20px 12px; border-bottom: 0; }
html[data-skin="play"] .picker-head b { font-size: 16px; }
html[data-skin="play"] .picker-head .icon-btn { width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
html[data-skin="play"] .picker-body { padding: 0 20px 20px; }
html[data-skin="play"] .picker h3 { display: flex; align-items: center; gap: 8px; margin: 8px 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
html[data-skin="play"] .picker h3::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: linear-gradient(180deg, #6bb8e6, #ed808c); }
html[data-skin="play"] .src { padding: 6px 6px 8px; border-radius: 16px; background: rgba(255,255,255,.035); }
html[data-skin="play"] .src:hover { background: rgba(255,255,255,.07); }
html[data-skin="play"] .src .pic { border-radius: 11px; }
html[data-skin="play"] .src .cap { font-size: 12.5px; padding: 0 2px; }
html[data-skin="play"] .src.on { background: rgba(143,112,242,.14); }
html[data-skin="play"] .src.on .pic { box-shadow: 0 0 0 2px #8f70f2, 0 0 16px rgba(130,140,255,.35); }

/* ================= play skin: dark glass, the blue-violet-pink gradient, Rubik ================= */
@font-face { font-family: "Rubik"; src: url("Rubik.ttf") format("truetype"); font-weight: 300 900; font-display: block; }
.hero-badge, .hero-text { display: none; }
html[data-skin="play"] {
  --label: #eef0f6; --secondary: #a3a8c3; --placeholder: #7d8299;
  --accent: #8f70f2; --green: #7be3b4; --red: #ff7a85;
  --input: rgba(255,255,255,.05); --input-edge: rgba(255,255,255,.10); --separator: rgba(255,255,255,.06);
  --track: rgba(255,255,255,.12); --push: rgba(255,255,255,.07); --push-hover: rgba(255,255,255,.12);
  --hover: rgba(255,255,255,.05); --seg-on: transparent;
  --menu: rgba(22,23,30,.98); --menu-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 16px 40px rgba(0,0,0,.55);
  --font: "Rubik", "Segoe UI", sans-serif; --edge: none;
  --tile: linear-gradient(120deg, #385cf2, #8f70f2 55%, #f294d1);
  --line: rgba(255,255,255,.08);
  color-scheme: dark;
}
html[data-skin="play"] body {
  display: flex; flex-direction: column;
  background-color: #111218;
  background-image: radial-gradient(520px 300px at 0% 0%, rgba(56,92,242,.16), transparent 70%), radial-gradient(420px 260px at 100% 0%, rgba(242,148,209,.09), transparent 70%);
  font: 400 14px/1.4 var(--font); font-feature-settings: normal; -webkit-font-smoothing: antialiased;
}
html[data-skin="play"] svg { stroke-width: 1.8; }

/* title bar: the program's name in a capsule with the two Joy-Con bars */
html[data-skin="play"] .head { flex: none; height: 34px; padding: 0; margin: 16px 20px 0; gap: 8px; }
html[data-skin="play"] .mark { display: none; }
html[data-skin="play"] .head .title { flex: 1; }
html[data-skin="play"] .head .title b { display: inline-flex; align-items: center; gap: 14px; height: 34px; padding: 0 16px 0 12px; border-radius: 17px;
  background: rgba(14,15,20,.78); border: 1px solid rgba(255,255,255,.10); color: #dbdee6; font-weight: 500; font-size: 13px; }
html[data-skin="play"] .head .title b::before { content: ""; width: 3px; height: 13px; border-radius: 2px; background: #6bb8e6; box-shadow: 4px 0 0 #ed808c; }
html[data-skin="play"] .head .title span { display: none; }
html[data-skin="play"] .head .icon-btn { width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--secondary); }
html[data-skin="play"] .head .icon-btn svg { width: 14px; height: 14px; }

/* the title bar holds it all: name, a status pill with the buffer switch, Save, record, close */
.top { display: contents; }
html[data-skin="play"] .top { flex: none; display: flex; align-items: center; gap: 8px; height: 34px; margin: 16px 20px 0; }
html[data-skin="play"] .head, html[data-skin="play"] .actions { display: contents; }
html[data-skin="play"] .actions .inline { order: 3; display: flex; flex: none; gap: 0; font-size: 0; margin-left: -50px; position: relative; }
html[data-skin="play"] .head .title { flex: none; order: 1; }
html[data-skin="play"] .hero-badge { display: none; }
html[data-skin="play"] .hero-text { order: 2; flex: 0 1 auto; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 52px 0 12px; border-radius: 17px;
  background: rgba(14,15,20,.78); border: 1px solid rgba(255,255,255,.10); font-size: 13px; font-weight: 500; white-space: nowrap; min-width: 0; }
html[data-skin="play"] .hero-text::before { content: ""; width: 8px; height: 8px; border-radius: 4px; flex: none; background: #7be3b4; box-shadow: 0 0 8px rgba(123,227,180,.7); }
html[data-skin="play"] body[data-state="rec"] .hero-text::before { background: #f74754; box-shadow: 0 0 8px rgba(247,71,84,.8); }
html[data-skin="play"] body[data-state="off"] .hero-text::before { background: #7d8299; box-shadow: none; }
html[data-skin="play"] .hero-text .eyebrow { display: none; }
html[data-skin="play"] .hero-text b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
html[data-skin="play"] #buffer { width: 38px; height: 24px; border-radius: 12px; position: relative; }
html[data-skin="play"] #buffer::after { width: 18px; height: 18px; }
html[data-skin="play"] #buffer.on::after { left: 17px; }
html[data-skin="play"] .actions .spacer { display: block; order: 4; flex: 1; }
html[data-skin="play"] .actions #save { order: 5; flex: none; height: 32px; padding: 0 14px; border-radius: 16px; font-size: 13px; background: var(--tile); border-color: transparent; color: #fff; }
html[data-skin="play"] .actions #save:disabled { background: var(--push); color: var(--secondary); }
html[data-skin="play"] .actions #record { order: 6; flex: none; width: 32px; height: 32px; min-width: 0; padding: 0; border-radius: 16px; font-size: 0;
  background: rgba(255,255,255,.06); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }

<script>
"use strict";
const TABS = [["capture", "Запись"], ["video", "Видео"], ["sound", "Звук"], ["keys", "Клавиши"], ["files", "Записи"], ["system", "Система"]];
const LENGTHS = [30, 60, 120, 300, 600, 900, 1800, 3600];
const CHECK = '<svg viewBox="0 0 12 12"><path d="M2.2 6.4l2.6 2.6 5-6"/></svg>';
const CHEVRONS = '<svg viewBox="0 0 10 14"><path d="M2.4 5.2L5 2.6l2.6 2.6M2.4 8.8L5 11.4l2.6-2.6"/></svg>';

// Filled by the program through rewind.update(); the sample is only for opening the page in a browser.
let S = {
  settings: { source: { type: "primary" }, crop: null, fps: 60, codec: "hevc", quality: 20, max_mbit: 100,
    buffer_seconds: 600, buffer_memory_mb: 4096, output_dir: "", cursor: true, system_sound: true, microphone: true,
    audio_kbit: 192, hotkeys: { save_clip: "Ctrl+Alt+F10", record: "Ctrl+Alt+F9", buffer: "Ctrl+Alt+F8", screenshot: "Ctrl+Alt+F11", marker: "Ctrl+Alt+F12", marker_note: "Ctrl+Alt+Shift+F12" },
    pad: { save_clip: "LB+RB+L3+R3", record: "", buffer: "", screenshot: "", marker: "", marker_note: "" }, notifications: true, mark_presets: ["Баг", "Смешно", "Эпично", "На шорт"] },
  pad: { learning: null, pads: null, hint: "" },
  jobs: {},
  apps: [{ exe: "eldenring.exe", name: "ELDEN RING" }, { exe: "telegram.exe", name: "Telegram Desktop" }],
  monitors: [{ device:"\\\\.\\DISPLAY1", label: "Экран 1 — 2560×1440, основной", primary: true }, { device: "\\\\.\\DISPLAY2", label: "Экран 2 — 3440×1440", primary: false }],
  windows: ["Telegram", "Obsidian"],
  status: { buffer_on: true, recording: false, has_last: false },
  files: [{ path: "C:\\Videos\\Rewind\\ELDEN RING\\2026-11-12 14-03-05 Клип.mp4", name: "2026-11-12 14-03-05 Клип", kind: "clip", app: "ELDEN RING", time: Date.now() - 600000, bytes: 88000000, secs: 120,
            markers: [{ id: 1, t: 41.2, title: "Баг с текстурой" }, { id: 2, t: 97, title: "" }] },
          { path: "C:\\Videos\\Rewind\\Рабочий стол\\2026-11-11 20-21-02 Запись.mp4", name: "2026-11-11 20-21-02 Запись", kind: "rec", app: "Рабочий стол", time: Date.now() - 90000000, bytes: 10500000, secs: 7.7, markers: [] }],
  taken: [], folder: "C:\\Users\\me\\Videos\\Rewind", version: "0.0.0",
  system: { available: true }, update: { state: "idle" },
};
let tab = "capture";
let listening = null;   // which hotkey field is waiting for keys
let partial = "";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const send = (o) => { if (window.ipc) window.ipc.postMessage(JSON.stringify(o)); };
const cmd = (name) => send({ t: "cmd", name });
function set(patch) { Object.assign(S.settings, patch); send({ t: "set", settings: patch }); render(); }

function duration(s) {
  if (s < 60) return s + " с";
  if (s < 3600) return s % 60 ? Math.floor(s / 60) + " мин " + (s % 60) + " с" : s / 60 + " мин";
  return s % 3600 < 60 ? s / 3600 + " ч" : Math.floor(s / 3600) + " ч " + Math.floor(s % 3600 / 60) + " мин";
}
// Long paths are cut in the middle, keeping the drive and the last folders: D:\…\Видео\Rewind
function shortPath(path, max) {
  if (path.length <= max) return path;
  const parts = path.split("\\");
  if (parts.length < 3) return path.slice(0, max - 1) + "…";
  let tail = parts.pop();
  while (parts.length > 1 && (parts[0] + "\\…\\" + parts[parts.length - 1] + "\\" + tail).length <= max) tail = parts.pop() + "\\" + tail;
  return parts[0] + "\\…\\" + tail;
}
function size(mb) { return mb >= 1024 ? (mb / 1024).toFixed(mb % 1024 ? 1 : 0).replace(".", ",") + " ГБ" : mb + " МБ"; }

// ---------- pop-up menus ----------
// items: [{ label, value, head?, line? }]
function popup(id, items, current) {
  const cur = items.find((i) => i.value !== undefined && same(i.value, current));
  return `<button class="popup" data-popup="${id}"><span>${esc(cur ? cur.label : "—")}</span>${CHEVRONS}</button>`;
}
// Compares values as data: objects from the program arrive with their keys in another order
// ({exe, name, type} vs {type, exe, name}), so key order must not matter.
const canon = (v) => v && typeof v === "object"
  ? (Array.isArray(v) ? "[" + v.map(canon).join(",") + "]" : "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}")
  : JSON.stringify(v);
const same = (a, b) => canon(a) === canon(b);
const MENUS = {};
function openMenu(button) {
  const { items, current, pick } = MENUS[button.dataset.popup];
  closeMenu();
  const veil = document.createElement("div"); veil.className = "veil"; veil.onmousedown = closeMenu;
  const menu = document.createElement("div"); menu.className = "menu"; menu.id = "menu";
  let index = 0, currentIndex = 0;
  for (const it of items) {
    const el = document.createElement("div");
    if (it.line) { el.className = "line"; }
    else if (it.head) { el.className = "head-item"; el.textContent = it.head; }
    else {
      el.className = "item";
      const on = same(it.value, current);
      if (on) currentIndex = index;
      el.innerHTML = (on ? CHECK : "") + "<span>" + esc(it.label) + "</span>";
      el.setAttribute("role", "menuitemradio");
      el.setAttribute("aria-checked", on ? "true" : "false");
      el.setAttribute("aria-label", it.label);
      // Release picks, as in macOS (press on the button, drag, release on an item); a click
      // also picks, which is what the keyboard, screen readers and UI automation send.
      const choose = () => { if (!menu.isConnected) return; closeMenu(); pick(it.value); };
      el.onmouseup = choose;
      el.onclick = choose;
    }
    menu.appendChild(el); index++;
  }
  document.body.append(veil, menu);
  button.classList.add("open");
  // Like a macOS pop-up: the current item sits right over the button, clamped to the window.
  const b = button.getBoundingClientRect();
  const row = menu.children[currentIndex] ? menu.children[currentIndex].offsetTop : 5;
  const w = Math.max(menu.offsetWidth, b.width + 16);
  menu.style.minWidth = w + "px";
  let top = b.top + (b.height - 22) / 2 - row;
  top = Math.max(4, Math.min(top, innerHeight - menu.offsetHeight - 4));
  let left = Math.min(b.left - 11, innerWidth - w - 4);
  menu.style.top = top + "px"; menu.style.left = Math.max(4, left) + "px";
}
// ---------- capture card ----------
function cardRows(src) {
  const mode = src.mode === "720p60" ? "720p60" : "1080p30";
  return `<div class="row"><div class="name">Режим карты<small>720p при 60 к/с плавнее; 1080p у этой карты — только 30 к/с</small></div>
      <div class="seg">${[["1080p30", "1080p · 30"], ["720p60", "720p · 60"]].map(([v, l]) => `<button class="${v === mode ? "on" : ""}" data-cmode="${v}">${l}</button>`).join("")}</div></div>
    <div class="row"><div class="name">Название<small>Папка для записей с карты</small></div>
      <input class="presets" data-clabel value="${esc(src.label || "")}" placeholder="Карта захвата" spellcheck="false" aria-label="Название для записей с карты"></div>`;
}
document.addEventListener("change", (e) => {
  if (e.target.dataset && e.target.dataset.clabel !== undefined) {
    set({ source: Object.assign({}, S.settings.source, { label: e.target.value.trim() }) });
  }
});

// ---------- source picker ----------
let pickerTimer = 0, pickerTick = 0;
function sourceLabel() {
  const it = sourceItems().find((x) => x.value && same(x.value, S.settings.source));
  return it ? it.label : "—";
}
function srcCard(value, label, url) {
  const on = same(value, S.settings.source);
  return `<button class="src ${on ? "on" : ""}" data-src="${esc(JSON.stringify(value))}" aria-pressed="${on}">
    <div class="pic">${url ? `<span>Нет картинки</span><img alt="" data-base="${url}" src="${url}&n=${pickerTick}" onerror="this.style.display='none'" onload="this.style.display=''">` : "<span>Камера — без превью</span>"}</div>
    <div class="cap">${esc(label)}</div></button>`;
}
function openPicker() {
  closePicker();
  const screens = S.monitors.map((m) => srcCard(m.primary ? { type: "primary" } : { type: "monitor", device: m.device }, m.label, "source?m=" + encodeURIComponent(m.device))).join("");
  const windows = S.windows.map((t) => srcCard({ type: "window", title: t }, t, "source?w=" + encodeURIComponent(t))).join("");
  const now = S.settings.source;
  const cards = (S.cards || []).map((n) => {
    // The same card keeps its mode and folder name when picked again.
    const value = now.type === "card" && now.name === n ? now : { type: "card", name: n, mode: "1080p30", label: "Карта захвата" };
    // Only capture cards show a picture: a webcam would switch on (its light too) just
    // because the picker was opened.
    const card = /capture|hdmi|elgato|avermedia|cam ?link|game/i.test(n) && !/webcam|camera/i.test(n);
    return srcCard(value, n, card ? "source?c=" + encodeURIComponent(n) : "");
  }).join("");
  const el = document.createElement("div");
  el.className = "picker"; el.id = "picker"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Что записывать");
  el.innerHTML = `<div class="picker-head"><b>Что записывать</b><button class="icon-btn" data-cmd="picker_close" aria-label="Закрыть"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="picker-body"><h3>Экраны</h3><div class="grid screens">${screens}</div>
    ${cards ? `<h3>Карты захвата и камеры</h3><div class="grid screens">${cards}</div>` : ""}
    ${windows ? `<h3>Окна</h3><div class="grid windows">${windows}</div>` : ""}</div>`;
  document.body.append(el);
  const cur = el.querySelector(".src.on");
  (cur || el.querySelector(".src")).focus();
  // Live pictures while the picker is open: a fresh one every two seconds.
  pickerTimer = setInterval(() => {
    pickerTick++;
    for (const img of el.querySelectorAll("img[data-base]")) img.src = img.dataset.base + "&n=" + pickerTick;
  }, 2000);
}
function closePicker() {
  clearInterval(pickerTimer);
  const el = $("picker");
  if (el) el.remove();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("picker")) { e.preventDefault(); closePicker(); } });

function closeMenu() {
  const wasOpen = !!$("menu");
  for (const el of document.querySelectorAll(".veil, .menu")) el.remove();
  for (const el of document.querySelectorAll(".popup.open")) el.classList.remove("open");
  // Fresh data that arrived while the menu was open is shown now.
  if (wasOpen && stale) { stale = false; render(); }
}
// The program sent new data while a menu was open or a hotkey was being typed: drawing it
// then would close the menu under the user's pointer, so it waits.
let stale = false;

// ---------- pages ----------
function sourceItems() {
  const items = S.monitors.map((m) => ({ label: m.label, value: m.primary ? { type: "primary" } : { type: "monitor", device: m.device } }));
  if (S.windows.length) {
    items.push({ line: true }, { head: "Окна" });
    for (const t of S.windows) items.push({ label: t, value: { type: "window", title: t } });
  }
  const cur = S.settings.source;
  if (cur.type === "card") items.push({ label: cur.name + ((S.cards || []).includes(cur.name) ? "" : " (не подключена)"), value: cur });
  if (cur.type === "window" && !S.windows.includes(cur.title)) items.push({ label: cur.title + " (закрыто)", value: cur });
  if (cur.type === "monitor" && !S.monitors.some((m) => m.device === cur.device)) items.push({ label: "Отключённый экран", value: cur });
  return items;
}

function pageCapture() {
  const s = S.settings, isWindow = s.source.type === "window";
  const isCard = s.source.type === "card";
  MENUS.source = { items: sourceItems(), current: s.source, pick: (v) => set({ source: v, crop: null }) };
  MENUS.length = { items: LENGTHS.map((v) => ({ label: duration(v), value: v })), current: s.buffer_seconds, pick: (v) => set({ buffer_seconds: v }) };
  const marks = [["recording", "Во время записи"], ["always", "Всегда"], ["off", "Выключен"]];

let renaming = null; // path of the file whose name is being edited

function when(ms) {
  const d = new Date(ms), now = new Date();
  const time = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  return time;
}
function dayTitle(ms) {
  const d = new Date(ms), today = new Date();
  const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((start(today) - start(d)) / 86400000);
  if (days === 0) return "Сегодня";
  if (days === 1) return "Вчера";
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: d.getFullYear() === today.getFullYear() ? undefined : "numeric" });
}
function length(secs) {
  if (!secs) return "";
  const s = Math.round(secs);
  return s < 60 ? s + " с" : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function bytes(n) {
  const mb = n / 1048576;
  return mb >= 1024 ? (mb / 1024).toFixed(1).replace(".", ",") + " ГБ" : (mb >= 10 ? Math.round(mb) : mb.toFixed(1).replace(".", ",")) + " МБ";
}

let openMarks = null; // path of the file whose markers are shown
function markWord(n) {
  const a = n % 10, b = n % 100;
  return n + " " + (a === 1 && b !== 11 ? "метка" : a >= 2 && a <= 4 && (b < 12 || b > 14) ? "метки" : "меток");
}
// Where a file's markers stand: written into the video as chapters (what Resolve shows),
// being written, waiting, failed, or not there (a file from before, or one that was open).
function markState(f) {
  const job = (S.jobs || {})[f.path];
  if (job && job.state === "writing") return { kind: "busy", short: Math.round((job.done || 0) * 100) + "%", text: "Метки записываются в видео" };
  if (job && job.state === "waiting") return { kind: "busy", short: "ждут", text: "Метки ждут записи в видео" };
  if (job && job.state === "failed") return { kind: "bad", short: "не в видео", text: "Метки не записаны в видео: " + job.error, retry: true };
  if ((f.chapters || 0) >= f.markers.length) return { kind: "ok", short: "✓ в видео", text: "Метки записаны в видео — при перетаскивании в Resolve они будут на клипе" };
  return { kind: "bad", short: "не в видео", text: "Меток нет в самом видео — Resolve их не увидит", retry: true };
}
function markRows(f) {
  const p = esc(f.path);
  const st = markState(f);
  const head = st.retry ? `<div class="mstate bad"><span>${esc(st.text)}</span><button class="push small" data-op="rewrite">Записать в видео</button></div>`
    : st.kind === "busy" ? `<div class="mstate" role="status"><span>${esc(st.text)}${st.short.endsWith("%") ? " · " + st.short : ""}. Пока не закончится, в Resolve их не будет.</span></div>` : "";
  return `<div class="marks" data-path="${p}">` + head + `<div role="list" aria-label="Метки">` + f.markers.map((m, i) => `
    <div class="mrow" role="listitem" data-mark="${m.id}" data-path="${p}">
      <img src="frame?p=${encodeURIComponent(f.path)}&t=${m.t.toFixed(2)}&v=${f.time}" alt="" loading="lazy">
      <span class="at">${clock(m.t)}</span>

      <button class="icon-btn" data-mop="go" aria-label="Обрезать с метки ${i + 1}" title="Открыть здесь">${ICONS.scissors}</button>
      <button class="icon-btn" data-mop="delete" aria-label="Удалить метку ${i + 1}" title="Удалить метку">${ICONS.close}</button>
    </div>`).join("") + `</div></div>`;
}
function fileRow(f) {
  const kind = f.kind === "clip" ? "Клип" : f.kind === "rec" ? "Запись" : f.kind === "shot" ? "Скриншот" : "Видео";
  // A name Rewind gave ("2026-11-12 14-03-05 Клип") reads better as "Клип · ELDEN RING";
  // a name the user typed is shown as it is, with the program next to the time.
  const own = !/^\d{4}-\d\d-\d\d \d\d-\d\d-\d\d/.test(f.name);
  const cut = /\(обрезка/.test(f.name) ? " (обрезка)" : ""; // made in the trim view
  const title = own ? f.name : (f.app ? `${kind}${cut} · ${f.app}` : kind + cut);
  const detail = [own ? f.app : "", when(f.time), length(f.secs), bytes(f.bytes)].filter(Boolean).join(" · ");
  const p = esc(f.path);
  const head = renaming === f.path
    ? `<input data-rename="${p}" value="${esc(f.name)}" aria-label="Новое имя файла" spellcheck="false">`
    : `<span class="title"><b title="${esc(f.name)}">${esc(title)}</b>${f.markers && f.markers.length
        ? (() => { const st = markState(f); return `<button class="pill ${st.kind}" data-op="marks" aria-expanded="${openMarks === f.path}" title="${esc(st.text)}" aria-label="Метки: ${markWord(f.markers.length)}, ${esc(st.text)}">${markWord(f.markers.length)} <span class="st">${esc(st.short)}</span>${ICONS.chevron}</button>`; })() : ""}</span>`;
  return `<div class="file" data-file="${p}">
      <img src="thumb?p=${encodeURIComponent(f.path)}&v=${f.time}" alt="" loading="lazy" onerror="this.outerHTML='<div class=noimg></div>'">
      <div class="info">${head}<span>${esc(detail)}</span></div>
      <div class="acts">
        <button class="icon-btn" data-op="open" aria-label="Открыть: ${esc(f.name)}" title="Открыть">${ICONS.play}</button>
        <button class="icon-btn" data-op="reveal" aria-label="Показать в папке: ${esc(f.name)}" title="Показать в папке">${ICONS.folder}</button>
        ${f.kind === "shot" ? "" : `<button class="icon-btn" data-op="trim" aria-label="Обрезать: ${esc(f.name)}" title="Обрезать">${ICONS.scissors}</button>`}
        <button class="icon-btn" data-op="rename" aria-label="Переименовать: ${esc(f.name)}" title="Переименовать">${ICONS.rename}</button>
        <button class="icon-btn" data-op="delete" aria-label="В корзину: ${esc(f.name)}" title="В корзину">${ICONS.trash}</button>
      </div>
    </div>${openMarks === f.path && f.markers && f.markers.length ? markRows(f) : ""}`;

let query = ""; // the search on the Records tab
// A file matches when every word of the search is in its name, program, kind or a marker title.
function matches(f, words) {
  const kind = f.kind === "clip" ? "клип" : f.kind === "rec" ? "запись" : f.kind === "shot" ? "скриншот" : "видео";
  const hay = [f.name, f.app, kind, ...(f.markers || []).map((m) => m.title || "")].join(" ").toLowerCase().replace(/ё/g, "е");
  return words.every((w) => hay.includes(w));
}
function pageFiles() {

  else if (!shown.length) list = `<div class="empty">Ничего не нашлось по «${esc(query.trim())}»</div>`;

    for (const f of shown) {

    ${notes}

    <div class="row"><div class="name">Обновлять автоматически<small>Проверка раз в сутки; новая версия ставится при следующем запуске</small></div><button class="switch ${s.auto_update ? "on" : ""}" data-toggle="auto_update"></button></div>
    ${version}${log}
    <div class="row"><div class="name">Убрать из системы<small>Удаляет ярлык и автозапуск. Настройки и записи остаются</small></div><button class="push small" data-cmd="remove_system">Убрать</button></div>`;
}

const PAGES = { capture: pageCapture, video: pageVideo, sound: pageSound, keys: pageKeys, files: pageFiles, system: pageSystem };

// ---------- recording timer ----------
// The program says how long the recording has run when it sends its state; the page counts

}
function statusText() {

    : st.buffer_on ? "Буфер · " + keep : "Буфер выключен";
  $("status").textContent = st.recording
    ? (st.buffer_on ? "Идёт запись · " + time + " · буфер хранит последние " + keep : "Идёт запись · " + time)
    : (st.buffer_on ? "Буфер хранит последние " + keep : "Выключен — экран не захватывается");

setInterval(() => { if (S.status && S.status.recording) statusText(); }, 1000);

function render() {

  document.body.dataset.state = st.recording ? "rec" : st.buffer_on ? "on" : "off";
  $("hero-eyebrow").textContent = st.recording ? "Идёт запись" : st.buffer_on ? "Буфер повтора" : "Буфер выключен";
  const play = s.skin === "play";
  $("mark").setAttribute("class", "mark " + (st.recording ? "rec" : st.buffer_on ? "on" : ""));
  statusText();
  $("save").textContent = play ? "Сохранить" : "Сохранить последние " + keep;
  $("save").title = "Сохранить последние " + keep;

// Updates a container to new markup in place: elements that are still there keep their
// identity, so keyboard focus stays on the switch you just pressed and screen readers and
// UI automation do not lose track of it. Only what changed is touched.
function morph(container, html) {

  patch(container, fresh.content);
}
function patch(old, now) {
  const a = Array.from(old.childNodes), b = Array.from(now.childNodes);
  for (let i = 0; i < b.length; i++) {
    const x = a[i], y = b[i];
    if (!x) { old.appendChild(y.cloneNode(true)); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) { old.replaceChild(y.cloneNode(true), x); continue; }
    if (x.nodeType === Node.TEXT_NODE) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    if (x.nodeType !== Node.ELEMENT_NODE) continue;
    for (const attr of Array.from(x.attributes)) {
      // aria-* are filled in afterwards by describe(); keep them.
      if (!y.hasAttribute(attr.name) && !attr.name.startsWith("aria-") && attr.name !== "role") x.removeAttribute(attr.name);
    }
    for (const attr of Array.from(y.attributes)) if (x.getAttribute(attr.name) !== attr.value) x.setAttribute(attr.name, attr.value);
    if ("disabled" in x) x.disabled = y.hasAttribute("disabled");
    patch(x, y);
  }
  for (let i = a.length - 1; i >= b.length; i--) a[i].remove();
}

// Names and states for screen readers and UI automation: without them every switch is the
// same nameless button and a pop-up says "10 мин" without saying what it sets.
function describe() {
  const rowName = (el) => {
    const name = el.closest(".row")?.querySelector(".name");
    return name ? (name.firstChild?.textContent || name.textContent).trim() : "";
  };
  // Tabs stay plain buttons marked "current": with role="tab" Chromium no longer turns an
  // accessibility "invoke" into a click, and aria-pressed would present them as switches.
  $("tabs").setAttribute("aria-label", "Разделы настроек");
  for (const b of $("tabs").querySelectorAll("button")) {
    if (b.classList.contains("on")) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  }
  $("buffer").setAttribute("aria-label", "Буфер повтора");
  for (const s of document.querySelectorAll(".switch")) {
    s.setAttribute("role", "switch");
    s.setAttribute("aria-checked", s.classList.contains("on") ? "true" : "false");
    if (s.id !== "buffer") s.setAttribute("aria-label", rowName(s));
  }
  for (const p of document.querySelectorAll(".popup")) {
    // No aria-haspopup: with it Chromium offers "expand" instead of "invoke" to UI automation,
    // and that never reaches the page, so the menu could not be opened that way.
    p.setAttribute("aria-label", `${rowName(p)}: ${p.textContent.trim()}`);
  }
  for (const b of document.querySelectorAll(".seg button[data-seg]")) {
    b.setAttribute("aria-pressed", b.classList.contains("on") ? "true" : "false");
    b.setAttribute("aria-label", `${rowName(b)}: ${b.textContent.trim()}`);
  }
  for (const k of document.querySelectorAll(".key")) k.setAttribute("aria-label", `${rowName(k)}: ${k.textContent.trim()}`);
  for (const b of document.querySelectorAll(".push.small")) {
    const name = rowName(b);
    if (name && !b.hasAttribute("aria-label")) b.setAttribute("aria-label", `${name}: ${b.textContent.trim()}`);
  }
  $("close").setAttribute("aria-label", "Закрыть");
}

// ---------- events ----------
document.addEventListener("mousedown", (e) => {

  // send only a click, with detail 0: open it for those too.

  const t = e.target.closest("button");

  if (t.dataset.src) { closePicker(); set({ source: JSON.parse(t.dataset.src), crop: null }); return; }

  }

  if (t.dataset.key) { startListening(t.dataset.key); return; }
  if (listening) stopListening();
  if (t.dataset.mop) {

    if (t.dataset.mop === "go") {

      openTrim(path, m ? m.t : 0);

  else if (t.dataset.clearNever !== undefined) set({ game_never: [] });

  else if (t.dataset.cmd) cmd(t.dataset.cmd);

  else if (t.id === "close") cmd("close");

document.addEventListener("contextmenu", (e) => e.preventDefault());

// ---------- hotkey capture ----------
const NAMES = { Backquote: "`", Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", Backslash: "\\", Semicolon: ";",
  Quote: "'", Comma: ",", Period: ".", Slash: "/", ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right",
  Space: "Space", Insert: "Insert", Delete: "Delete", Home: "Home", End: "End", PageUp: "PageUp", PageDown: "PageDown",
  PrintScreen: "PrintScreen", ScrollLock: "ScrollLock", Pause: "Pause", Tab: "Tab" };
function keyName(code) {
  let m;
  if ((m = /^Key([A-Z])$/.exec(code))) return m[1];
  if ((m = /^Digit(\d)$/.exec(code))) return m[1];
  if ((m = /^Numpad(\d)$/.exec(code))) return "Num" + m[1];
  if (/^F([1-9]|1\d|2[0-4])$/.test(code)) return code;

  const standalone = /^F\d+$/.test(name) || ["PrintScreen", "ScrollLock", "Pause", "Insert"].includes(name);
  if (!m.length && !standalone) { partial = "Добавьте Ctrl, Alt или Shift"; render(); return; }
  const id = listening;
  listening = null; partial = "";
  S.settings.hotkeys = Object.assign({}, S.settings.hotkeys, { [id]: m.concat(name).join("+") });
  send({ t: "set", settings: { hotkeys: S.settings.hotkeys } });
  cmd("hotkeys_resume"); render();
}
document.addEventListener("keydown", (e) => {
  if (padLearning() && (e.key === "Escape" || e.key === "Backspace")) {
    e.preventDefault();
    if (e.key === "Backspace") {
      S.settings.pad = Object.assign({}, S.settings.pad, { [padLearning()]: "" });
      send({ t: "set", settings: { pad: S.settings.pad } });
    }
    send({ t: "pad_learn", id: null });
    return;
  }
  if (!listening) { if (e.key === "Escape" && !T.path && !(e.target.closest && e.target.closest("input"))) { if ($("menu")) closeMenu(); else cmd("close"); } return; }
  e.preventDefault();
  if (e.key === "Escape") { stopListening(); return; }
  if (e.key === "Backspace" && !mods(e).length) {
    const id = listening; listening = null;
    S.settings.hotkeys = Object.assign({}, S.settings.hotkeys, { [id]: "" });
    send({ t: "set", settings: { hotkeys: S.settings.hotkeys } });
    cmd("hotkeys_resume"); render(); return;
  }
  finishKey(e);
}, true);
// PrintScreen only reports its release.
document.addEventListener("keyup", (e) => { if (listening && e.code === "PrintScreen") { e.preventDefault(); finishKey(e); } }, true);
window.addEventListener("blur", () => { closeMenu(); if (listening) stopListening(); });

function fileAction(op, path) {
  if (op === "trim") { openTrim(path); return; }
  if (op === "marks") { openMarks = openMarks === path ? null : path; render(); return; }
  if (op === "rename") {
    renaming = path; render();
    const field = document.querySelector("[data-rename]");
    if (field) { field.focus(); field.select(); }
    return;
  }
  send({ t: "file", op, path });
}
function finishRename(field, keep) {
  const path = field.dataset.rename, name = field.value.trim();
  renaming = null;
  const old = (S.files || []).find((f) => f.path === path);
  if (keep && name && old && name !== old.name) send({ t: "file", op: "rename", path, name });
  render();
}
document.addEventListener("keydown", (e) => {
  const field = e.target.closest && e.target.closest("[data-rename]");
  if (!field) return;
  if (e.key === "Enter") { e.preventDefault(); finishRename(field, true); }

}, true);
document.addEventListener("focusout", (e) => {
  if (e.target.dataset && e.target.dataset.rename && renaming) finishRename(e.target, true);
});

// ---------- search and preset titles ----------
document.addEventListener("input", (e) => {
  if (e.target.dataset && "search" in e.target.dataset) { query = e.target.value; render(); }
});
document.addEventListener("change", (e) => {
  if (!(e.target.dataset && "presets" in e.target.dataset)) return;
  const list = e.target.value.split(",").map((t) => t.trim()).filter(Boolean).slice(0, 8);
  set({ mark_presets: list });
});
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t.dataset && "search" in t.dataset && e.key === "Escape" && query) { e.preventDefault(); query = ""; render(); t.focus(); }
  if (t.dataset && "presets" in t.dataset && e.key === "Enter") { e.preventDefault(); t.blur(); }
}, true);
document.addEventListener("click", (e) => {

}, true);

// ---------- marker titles ----------
// A field whose text would be lost if the page were drawn again under it.
function editingMark() { const a = document.activeElement; return !!(a && a.dataset && ("markTitle" in a.dataset || "presets" in a.dataset)); }
function commitMark(field) {
  const row = field.closest("[data-mark]");
  const f = (S.files || []).find((x) => x.path === row.dataset.path);
  const m = f && f.markers.find((x) => x.id === Number(row.dataset.mark));
  const title = field.value.trim();
  if (m && title !== (m.title || "")) { m.title = title; send({ t: "mark", op: "title", path: row.dataset.path, id: m.id, title }); }
}
document.addEventListener("keydown", (e) => {

document.addEventListener("dblclick", (e) => {

// ---------- trim view ----------
// The video plays in the page (served in byte ranges). If this computer cannot play it,
// single pictures decoded by Rewind are shown instead.
const T = { path: null, dur: 0, a: 0, b: 0, t: 0, video: null, img: null, fallback: false, busy: false, drag: null };

function clock(sec) {
  const s = Math.max(0, sec);
  const m = Math.floor(s / 60), r = s - m * 60;
  return m + ":" + r.toFixed(1).padStart(4, "0");
}

function openTrim(path, at) {
  const f = (S.files || []).find((x) => x.path === path);
  T.path = path; T.dur = f && f.secs ? f.secs : 0; T.a = 0; T.b = T.dur; T.t = at || 0; T.fallback = false; T.busy = false;
  T.marks = f && f.markers ? f.markers.map((m) => m.t) : [];
  closeMenu();
  const name = f ? f.name : path.split("\\").pop().replace(/\.mp4$/i, "");
  $("trim").innerHTML = `
    <div class="stage" id="stage"><span class="wait">Загружаю…</span></div>
    <div class="timeline" id="tl" role="group" aria-label="Шкала обрезки">
      <div class="bar"></div><div class="sel" id="tl-sel"></div><div id="tl-marks"></div><div class="playhead" id="tl-head"></div>
      <button class="knob" id="tl-a" aria-label="Начало"></button><button class="knob" id="tl-b" aria-label="Конец"></button>
    </div>
    <div class="times"><span id="tl-ta"></span><span id="tl-len"></span><span id="tl-tb"></span></div>
    <div class="trimbar">
      <button class="icon-btn" id="tr-play" aria-label="Воспроизвести" title="Пробел">${ICONS.play}</button>
      <button class="push small" id="tr-in" title="Клавиша I">Начало здесь</button>
      <button class="push small" id="tr-out" title="Клавиша O">Конец здесь</button>
      <div class="spacer"></div>
      <button class="push small" id="tr-cancel">Отмена</button>
      <button class="push small primary" id="tr-save" title="Enter">Сохранить</button>
    </div>
    <div class="trimnote" id="tr-note"></div>`;
  $("tr-note").textContent = "«" + name + "» — исходный файл останется, новый ляжет рядом. Начало встанет на ближайший ключевой кадр, до 2 с раньше.";
  document.body.classList.add("trimming");

function fallbackTrim() {

  const pct = (x) => (T.dur ? (x / T.dur) * 100 : 0) + "%";
  $("tl-a").style.left = pct(T.a);
  $("tl-b").style.left = pct(T.b);
  $("tl-sel").style.left = pct(T.a);
  $("tl-sel").style.width = T.dur ? ((T.b - T.a) / T.dur) * 100 + "%" : "0";
  $("tl-head").style.left = pct(T.t);
  const ticks = (T.marks || []).map((t, i) => `<div class="mk" style="left:${pct(t)}" title="Метка ${i + 1}"></div>`).join("");
  if ($("tl-marks").dataset.v !== ticks) { $("tl-marks").innerHTML = ticks; $("tl-marks").dataset.v = ticks; }
  $("tl-ta").textContent = "Начало " + clock(T.a);
  $("tl-tb").textContent = "Конец " + clock(T.b);
  $("tl-len").innerHTML = "Длина <b>" + clock(T.b - T.a) + "</b>";
  $("tl-a").setAttribute("aria-valuetext", clock(T.a));
  $("tl-b").setAttribute("aria-valuetext", clock(T.b));
  $("tr-save").disabled = T.busy || T.b - T.a < 0.5;
}

function closeTrim() {
  if (T.video) { T.video.pause(); T.video.removeAttribute("src"); T.video.load(); }
  T.path = null; T.video = null; T.img = null;
  $("trim").innerHTML = "";
  document.body.classList.remove("trimming");
  render();
}

function setPoint(which) {
  if (which === "a") T.a = Math.min(T.t, T.b - 0.5);
  else T.b = Math.max(T.t, T.a + 0.5);
  T.a = Math.max(0, T.a); T.b = Math.min(T.dur, T.b);
  drawTrim();
}

function saveTrim() {
  if (T.busy || T.b - T.a < 0.5) return;
  T.busy = true;
  $("tr-note").classList.remove("bad");
  $("tr-note").textContent = "Сохраняю…";
  drawTrim();
  send({ t: "trim", path: T.path, start: T.a, end: T.b });
}

function timeAt(clientX) {
  const r = $("tl").getBoundingClientRect();
  return Math.min(1, Math.max(0, (clientX - r.left) / r.width)) * (T.dur || 0);
}
document.addEventListener("pointerdown", (e) => {
  if (!T.path || !e.target.closest || !e.target.closest("#tl")) return;
  e.preventDefault();
  T.drag = e.target.id === "tl-a" ? "a" : e.target.id === "tl-b" ? "b" : "t";
  if (T.video && !T.video.paused) T.video.pause();
  const move = (ev) => {
    const t = timeAt(ev.clientX);
    if (T.drag === "a") T.a = Math.min(t, T.b - 0.5);
    else if (T.drag === "b") T.b = Math.max(t, T.a + 0.5);
    seekTrim(t);
  };
  move(e);
  const up = () => { T.drag = null; document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up); };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
});
document.addEventListener("click", (e) => {
  if (!T.path) return;
  const id = e.target.closest && e.target.closest("button") && e.target.closest("button").id;
  if (id === "tr-play" && T.video) { if (T.video.paused) { if (T.t >= T.b - 0.05) seekTrim(T.a); T.video.play(); } else T.video.pause(); }
  else if (id === "tr-in") setPoint("a");
  else if (id === "tr-out") setPoint("b");
  else if (id === "tr-cancel") closeTrim();
  else if (id === "tr-save") saveTrim();
  else if (id === "tl-a") seekTrim(T.a);
  else if (id === "tl-b") seekTrim(T.b);
}, true);
document.addEventListener("keydown", (e) => {
  if (!T.path || listening) return;
  const step = e.shiftKey ? 1 / 60 : 1;
  const handled = {
    " ": () => $("tr-play").click(),
    ArrowLeft: () => seekTrim(T.t - step),
    ArrowRight: () => seekTrim(T.t + step),
    Home: () => seekTrim(T.a),
    End: () => seekTrim(T.b),
    // Markers: to the previous / next one.
    PageUp: () => { const m = (T.marks || []).filter((t) => t < T.t - 0.05); if (m.length) seekTrim(m[m.length - 1]); },
    PageDown: () => { const m = (T.marks || []).filter((t) => t > T.t + 0.05); if (m.length) seekTrim(m[0]); },
    Enter: () => saveTrim(),
    Escape: () => closeTrim(),
  }[e.key] || ({ KeyI: () => setPoint("a"), BracketLeft: () => setPoint("a"), KeyO: () => setPoint("b"), BracketRight: () => setPoint("b") })[e.code];
  if (handled) { e.preventDefault(); e.stopImmediatePropagation(); handled(); }
}, true);

window.rewind = {
  trim(path) { tab = "files"; if (!S.files) cmd("files"); render(); openTrim(path); },
  trimmed(r) {
    T.busy = false;
    if (r.ok) { closeTrim(); tab = "files"; render(); return; }
    if ($("tr-note")) { $("tr-note").classList.add("bad"); $("tr-note").textContent = "Не получилось: " + r.error; }
    drawTrim();
  },
  jobs(map) {
    S.jobs = map;
    if (tab === "files" && !renaming) { if ($("menu") || listening || editingMark()) stale = true; else render(); }
  },
  files(list) { S.files = list; if (tab === "files" && !renaming) { if ($("menu") || listening || editingMark()) stale = true; else render(); } },
  update(state) {
    Object.assign(S, state);
    if (S.status && S.status.recording) recSince = Date.now() - (S.status.rec_secs || 0) * 1000;
    if (listening || $("menu") || editingMark()) stale = true;
    else render();
  },
  // Test aid: switch the page from outside.
  show(name) { tab = name; if (tab === "files") cmd("files"); render(); },
};
render();
send({ t: "ready" });
</script>
</body>
</html>
