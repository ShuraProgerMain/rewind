<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Rewind</title>
<style>
@font-face { font-family: "Inter"; src: url("Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }

:root {
  --label: #ececee; --secondary: #9c9ca1; --placeholder: #77777c;
  --accent: #0a84ff; --green: #32d74b; --red: #ff453a;
  --input: #3a3a3c; --input-edge: rgba(255,255,255,.1); --separator: rgba(255,255,255,.1);
  --track: rgba(255,255,255,.14); --push: rgba(255,255,255,.13); --push-hover: rgba(255,255,255,.26);
  --hover: rgba(255,255,255,.10); --seg-on: rgba(255,255,255,.24);
  --material: rgba(30,30,32,.74); --menu: rgba(40,40,43,.92);
  --edge: inset 0 0 0 1px rgba(255,255,255,.14);
  --menu-shadow: 0 0 0 1px rgba(0,0,0,.75), inset 0 0 0 1px rgba(255,255,255,.14), 0 12px 36px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.35);
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --label: #1d1d1f; --secondary: #6e6e73; --placeholder: #a0a0a5;
    --accent: #007aff; --green: #28cd41; --red: #ff3b30;
    --input: #fff; --input-edge: rgba(0,0,0,.16); --separator: rgba(0,0,0,.09);
    --track: rgba(0,0,0,.09); --push: rgba(0,0,0,.06); --push-hover: rgba(0,0,0,.12);
    --hover: rgba(0,0,0,.07); --seg-on: #fff;
    --material: rgba(246,246,248,.72); --menu: rgba(246,246,248,.94);
    --edge: none;
    --menu-shadow: 0 0 0 1px rgba(0,0,0,.17), 0 12px 36px rgba(0,0,0,.26), 0 1px 3px rgba(0,0,0,.12);
    color-scheme: light;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--material); color: var(--label);
  font: 400 13px/18px var(--font); font-feature-settings: "tnum" 1;
  box-shadow: var(--edge); overflow: hidden;
  user-select: none; -webkit-user-select: none; cursor: default;
}
svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }
button { font: inherit; color: inherit; cursor: default; }

/* ---------- header ---------- */
.head { height: 58px; padding: 0 12px 0 18px; display: flex; align-items: center; gap: 11px; }
.mark { width: 22px; height: 22px; flex: none; }
.mark circle.ring { stroke: var(--secondary); stroke-width: 1.8; }
.mark circle.dot { stroke: none; fill: var(--secondary); }
.mark.on circle.ring { stroke: var(--label); }
.mark.on circle.dot { fill: var(--label); }
.mark.rec circle.ring { stroke: var(--label); }
.mark.rec circle.dot { fill: var(--red); }
.title { flex: 1; min-width: 0; }
.title b { display: block; font-weight: 600; }
.title span { display: block; font-size: 11px; line-height: 15px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 30px; height: 30px; border: 0; border-radius: 7px; background: none; color: var(--secondary); display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--hover); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- actions ---------- */
.actions { padding: 2px 18px 16px; display: flex; align-items: center; gap: 10px; }
.push { height: 30px; min-width: 96px; padding: 0 14px; border: 0; border-radius: 7px; background: var(--push); white-space: nowrap; }
.push:hover { background: var(--push-hover); }
.push:disabled { opacity: .45; background: var(--push); }
.push.primary, .push.primary:hover { background: var(--accent); color: #fff; }
.push.stop, .push.stop:hover { background: var(--red); color: #fff; }
.push.small { height: 26px; min-width: 0; padding: 0 11px; }
.spacer { flex: 1; }
.inline { display: flex; align-items: center; gap: 9px; color: var(--secondary); }

/* ---------- tabs ---------- */
.sep { height: 1px; background: var(--separator); }
.tabs { display: flex; justify-content: center; padding: 14px 18px 6px; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--track); }
.seg button { height: 24px; padding: 0 12px; border: 0; border-radius: 5px; background: none; color: var(--label); }
.seg button.on { background: var(--seg-on); box-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.18); }

/* ---------- rows ---------- */
.page { padding: 4px 18px 0; }
.row { min-height: 42px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--separator); }
.row:last-of-type { border-bottom: 0; }
.row > .name { flex: 1; min-width: 0; }
.row > .name small { display: block; font-size: 11px; line-height: 15px; color: var(--secondary); }
.row > .value { color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 290px; }
.note { padding: 9px 0 0; font-size: 11px; line-height: 15px; color: var(--secondary); }
.row.tall { padding: 7px 0; }

/* ---------- recordings list ---------- */
.list { height: 188px; overflow-y: auto; margin: 0 -8px; padding: 0 8px; }
.list::-webkit-scrollbar { width: 6px; }
.list::-webkit-scrollbar-thumb { background: var(--track); border-radius: 3px; }
.day { font-size: 11px; line-height: 15px; color: var(--secondary); padding: 8px 0 4px; }
.file { display: flex; align-items: center; gap: 11px; height: 58px; padding: 0 6px; margin: 0 -6px; border-radius: 7px; }
.file:hover, .file:focus-within { background: var(--hover); }
.file img, .file .noimg { width: 80px; height: 45px; border-radius: 4px; flex: none; object-fit: cover; background: var(--track); }
.file .info { flex: 1; min-width: 0; }
.file .info b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file .info span { display: block; font-size: 11px; line-height: 15px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file .acts { display: flex; gap: 2px; opacity: 0; }
.file:hover .acts, .file:focus-within .acts { opacity: 1; }
.file .acts .icon-btn { width: 28px; height: 28px; }
.file input { width: 100%; height: 24px; padding: 0 6px; font: inherit; font-weight: 600; color: var(--label); background: var(--input); border: 1px solid var(--accent); border-radius: 5px; outline: none; }
.empty { height: 188px; display: grid; place-items: center; color: var(--secondary); text-align: center; }

/* ---------- switch ---------- */
.switch { width: 34px; height: 20px; border: 0; padding: 0; border-radius: 10px; background: var(--track); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.3); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 16px; }

/* ---------- pop-up button and its menu ---------- */
.popup { height: 26px; max-width: 300px; padding: 0 7px 0 10px; border: 0; border-radius: 7px; background: var(--push); display: inline-flex; align-items: center; gap: 8px; }
.popup:hover, .popup.open { background: var(--push-hover); }
.popup span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popup svg { width: 10px; height: 14px; flex: none; color: var(--secondary); stroke-width: 1.4; }
.menu { position: fixed; z-index: 10; min-width: 120px; max-width: 420px; max-height: 420px; overflow-y: auto; padding: 5px; border-radius: 8px;
  background: var(--menu); box-shadow: var(--menu-shadow); }
.menu::-webkit-scrollbar { width: 0; }
.menu .item { height: 22px; padding: 0 12px 0 21px; border-radius: 4px; display: flex; align-items: center; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu .item span { overflow: hidden; text-overflow: ellipsis; }
.menu .item:hover { background: var(--accent); color: #fff; }
.menu .item svg { position: absolute; left: 4px; top: 5px; width: 12px; height: 12px; stroke-width: 1.7; }
.menu .line { height: 1px; margin: 4px 8px; background: var(--separator); }
.menu .head-item { height: 20px; padding: 0 12px 0 21px; font-size: 11px; color: var(--secondary); display: flex; align-items: center; }
.veil { position: fixed; inset: 0; z-index: 9; }

/* ---------- hotkey field ---------- */
.key { height: 30px; min-width: 150px; padding: 0 9px; border: 1px solid var(--input-edge); border-radius: 6px; background: var(--input); text-align: center; display: inline-flex; align-items: center; justify-content: center; }
.key.empty { color: var(--placeholder); }
.key.listening { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); color: var(--secondary); }
.key.taken { border-color: var(--red); }
.bad { color: var(--red); font-size: 11px; }

</style>
</head>
<body>

<div class="head" id="drag">
  <svg class="mark" id="mark" viewBox="0 0 22 22"><circle class="ring" cx="11" cy="11" r="8.6"/><circle class="dot" cx="11" cy="11" r="3.9"/></svg>
  <div class="title"><b>Rewind</b><span id="status"></span></div>
  <button class="icon-btn" id="close" title="Закрыть"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
</div>

<div class="actions">
  <button class="push" id="save"></button>
  <button class="push primary" id="record"></button>
  <div class="spacer"></div>
  <div class="inline">Буфер повтора <button class="switch" id="buffer"></button></div>
</div>
<div class="sep"></div>

<div class="tabs"><div class="seg" id="tabs"></div></div>
<div class="page" id="page"></div>

<script>
"use strict";
const TABS = [["capture", "Запись"], ["video", "Видео"], ["sound", "Звук"], ["keys", "Клавиши"], ["files", "Записи"], ["system", "Система"]];
const LENGTHS = [30, 60, 120, 300, 600, 900, 1800, 3600];
const CHECK = '<svg viewBox="0 0 12 12"><path d="M2.2 6.4l2.6 2.6 5-6"/></svg>';
const CHEVRONS = '<svg viewBox="0 0 10 14"><path d="M2.4 5.2L5 2.6l2.6 2.6M2.4 8.8L5 11.4l2.6-2.6"/></svg>';

// Filled by the program through rewind.update(); the sample is only for opening the page in a browser.
let S = {
  settings: { source: { type: "primary" }, crop: null, fps: 60, codec: "hevc", quality: 20, max_mbit: 100,
    buffer_seconds: 600, buffer_memory_mb: 4096, output_dir: "", cursor: true, system_sound: true, microphone: true,
    audio_kbit: 192, hotkeys: { save_clip: "Ctrl+Alt+F10", record: "Ctrl+Alt+F9", buffer: "Ctrl+Alt+F8" }, notifications: true },
  apps: [{ exe: "eldenring.exe", name: "ELDEN RING" }, { exe: "telegram.exe", name: "Telegram Desktop" }],
  monitors: [{ device:"\\\\.\\DISPLAY1", label: "Экран 1 — 2560×1440, основной", primary: true }, { device: "\\\\.\\DISPLAY2", label: "Экран 2 — 3440×1440", primary: false }],
  windows: ["Telegram", "Obsidian"],
  status: { buffer_on: true, recording: false, has_last: false },
  files: [{ path: "C:\\Videos\\Rewind\\ELDEN RING\\2026-11-12 14-03-05 Клип.mp4", name: "2026-11-12 14-03-05 Клип", kind: "clip", app: "ELDEN RING", time: Date.now() - 600000, bytes: 88000000, secs: 120 },
          { path: "C:\\Videos\\Rewind\\Рабочий стол\\2026-11-11 20-21-02 Запись.mp4", name: "2026-11-11 20-21-02 Запись", kind: "rec", app: "Рабочий стол", time: Date.now() - 90000000, bytes: 10500000, secs: 7.7 }],
  taken: [], folder: "C:\\Users\\me\\Videos\\Rewind", version: "0.0.0",
  system: { available: true }, update: { state: "idle" },
};
let tab = "capture";
let listening = null;   // which hotkey field is waiting for keys
let partial = "";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const send = (o) => { if (window.ipc) window.ipc.postMessage(JSON.stringify(o)); };
const cmd = (name) => send({ t: "cmd", name });
function set(patch) { Object.assign(S.settings, patch); send({ t: "set", settings: patch }); render(); }

function duration(s) {
  if (s < 60) return s + " с";
  if (s < 3600) return s % 60 ? Math.floor(s / 60) + " мин " + (s % 60) + " с" : s / 60 + " мин";
  return s % 3600 < 60 ? s / 3600 + " ч" : Math.floor(s / 3600) + " ч " + Math.floor(s % 3600 / 60) + " мин";
}
// Long paths are cut in the middle, keeping the drive and the last folders: D:\…\Видео\Rewind
function shortPath(path, max) {
  if (path.length <= max) return path;
  const parts = path.split("\\");
  if (parts.length < 3) return path.slice(0, max - 1) + "…";
  let tail = parts.pop();
  while (parts.length > 1 && (parts[0] + "\\…\\" + parts[parts.length - 1] + "\\" + tail).length <= max) tail = parts.pop() + "\\" + tail;
  return parts[0] + "\\…\\" + tail;
}
function size(mb) { return mb >= 1024 ? (mb / 1024).toFixed(mb % 1024 ? 1 : 0).replace(".", ",") + " ГБ" : mb + " МБ"; }

// ---------- pop-up menus ----------
// items: [{ label, value, head?, line? }]
function popup(id, items, current) {
  const cur = items.find((i) => i.value !== undefined && same(i.value, current));
  return `<button class="popup" data-popup="${id}"><span>${esc(cur ? cur.label : "—")}</span>${CHEVRONS}</button>`;
}
// Compares values as data: objects from the program arrive with their keys in another order
// ({exe, name, type} vs {type, exe, name}), so key order must not matter.
const canon = (v) => v && typeof v === "object"
  ? (Array.isArray(v) ? "[" + v.map(canon).join(",") + "]" : "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}")
  : JSON.stringify(v);
const same = (a, b) => canon(a) === canon(b);
const MENUS = {};
function openMenu(button) {
  const { items, current, pick } = MENUS[button.dataset.popup];
  closeMenu();
  const veil = document.createElement("div"); veil.className = "veil"; veil.onmousedown = closeMenu;
  const menu = document.createElement("div"); menu.className = "menu"; menu.id = "menu";
  let index = 0, currentIndex = 0;
  for (const it of items) {
    const el = document.createElement("div");
    if (it.line) { el.className = "line"; }
    else if (it.head) { el.className = "head-item"; el.textContent = it.head; }
    else {
      el.className = "item";
      const on = same(it.value, current);
      if (on) currentIndex = index;
      el.innerHTML = (on ? CHECK : "") + "<span>" + esc(it.label) + "</span>";
      el.setAttribute("role", "menuitemradio");
      el.setAttribute("aria-checked", on ? "true" : "false");
      el.setAttribute("aria-label", it.label);
      // Release picks, as in macOS (press on the button, drag, release on an item); a click
      // also picks, which is what the keyboard, screen readers and UI automation send.
      const choose = () => { if (!menu.isConnected) return; closeMenu(); pick(it.value); };
      el.onmouseup = choose;
      el.onclick = choose;
    }
    menu.appendChild(el); index++;
  }
  document.body.append(veil, menu);
  button.classList.add("open");
  // Like a macOS pop-up: the current item sits right over the button, clamped to the window.
  const b = button.getBoundingClientRect();
  const row = menu.children[currentIndex] ? menu.children[currentIndex].offsetTop : 5;
  const w = Math.max(menu.offsetWidth, b.width + 16);
  menu.style.minWidth = w + "px";
  let top = b.top + (b.height - 22) / 2 - row;
  top = Math.max(4, Math.min(top, innerHeight - menu.offsetHeight - 4));
  let left = Math.min(b.left - 11, innerWidth - w - 4);
  menu.style.top = top + "px"; menu.style.left = Math.max(4, left) + "px";
}
function closeMenu() {
  const wasOpen = !!$("menu");
  for (const el of document.querySelectorAll(".veil, .menu")) el.remove();
  for (const el of document.querySelectorAll(".popup.open")) el.classList.remove("open");
  // Fresh data that arrived while the menu was open is shown now.
  if (wasOpen && stale) { stale = false; render(); }
}
// The program sent new data while a menu was open or a hotkey was being typed: drawing it
// then would close the menu under the user's pointer, so it waits.
let stale = false;

// ---------- pages ----------
function sourceItems() {
  const items = S.monitors.map((m) => ({ label: m.label, value: m.primary ? { type: "primary" } : { type: "monitor", device: m.device } }));
  if (S.windows.length) {
    items.push({ line: true }, { head: "Окна" });
    for (const t of S.windows) items.push({ label: t, value: { type: "window", title: t } });
  }
  const cur = S.settings.source;
  if (cur.type === "window" && !S.windows.includes(cur.title)) items.push({ label: cur.title + " (закрыто)", value: cur });
  if (cur.type === "monitor" && !S.monitors.some((m) => m.device === cur.device)) items.push({ label: "Отключённый экран", value: cur });
  return items;
}

function pageCapture() {
  const s = S.settings, isWindow = s.source.type === "window";
  MENUS.source = { items: sourceItems(), current: s.source, pick: (v) => set({ source: v, crop: null }) };
  MENUS.length = { items: LENGTHS.map((v) => ({ label: duration(v), value: v })), current: s.buffer_seconds, pick: (v) => set({ buffer_seconds: v }) };
  const marks = [["recording", "Во время записи"], ["always", "Всегда"], ["off", "Выключен"]];
  MENUS.indicator = { items: marks.map(([v, l]) => ({ label: l, value: v })), current: s.indicator || "recording", pick: (v) => set({ indicator: v }) };
  MENUS.memory = { items: [1024, 2048, 4096, 8192, 16384].map((v) => ({ label: size(v), value: v })), current: s.buffer_memory_mb, pick: (v) => set({ buffer_memory_mb: v }) };
  if (!LENGTHS.includes(s.buffer_seconds)) MENUS.length.items.push({ label: duration(s.buffer_seconds), value: s.buffer_seconds });
  if (![1024, 2048, 4096, 8192, 16384].includes(s.buffer_memory_mb)) MENUS.memory.items.push({ label: size(s.buffer_memory_mb), value: s.buffer_memory_mb });
  const area = s.crop ? `${s.crop[2]}×${s.crop[3]}, от точки ${s.crop[0]}, ${s.crop[1]}` : (isWindow ? "Всё окно" : "Весь экран");
  const worst = Math.round(s.max_mbit * s.buffer_seconds / 8);
  return `
    <div class="row"><div class="name">Что записывать</div>${popup("source", MENUS.source.items, s.source)}</div>
    <div class="row"><div class="name">Область</div><div class="value">${esc(area)}</div>
      ${s.crop ? '<button class="push small" data-cmd="clear_area">Сбросить</button>' : ""}
      ${isWindow ? "" : '<button class="push small" data-cmd="pick_area">Выбрать…</button>'}</div>
    <div class="row"><div class="name">Длина буфера</div>${popup("length", MENUS.length.items, s.buffer_seconds)}</div>
    <div class="row"><div class="name">Память под буфер</div>${popup("memory", MENUS.memory.items, s.buffer_memory_mb)}</div>
    <div class="row"><div class="name">Индикатор на экране<small>В углу записываемого экрана; в запись не попадает</small></div>${popup("indicator", MENUS.indicator.items, s.indicator || "recording")}</div>
    <div class="row"><div class="name">Указатель мыши в записи</div><button class="switch ${s.cursor ? "on" : ""}" data-toggle="cursor"></button></div>
    <div class="note">Буфер хранится в оперативной памяти уже сжатым. ${duration(s.buffer_seconds)} займут не больше ${size(Math.min(worst, s.buffer_memory_mb))}${worst > s.buffer_memory_mb ? " — при насыщенной картинке в память поместится меньше времени" : ", обычно в несколько раз меньше"}.</div>`;
}

function seg(key, options, current) {
  return `<div class="seg">${options.map(([v, l]) => `<button class="${same(v, current) ? "on" : ""}" data-seg="${key}" data-value='${JSON.stringify(v)}'>${l}</button>`).join("")}</div>`;
}

function pageVideo() {
  const s = S.settings;
  const qualities = [[17, "Высокое"], [20, "Хорошее"], [24, "Компактное"]];
  MENUS.quality = { items: qualities.map(([v, l]) => ({ label: l, value: v })), current: s.quality, pick: (v) => set({ quality: v }) };
  if (!qualities.some(([v]) => v === s.quality)) MENUS.quality.items.push({ label: "Своё — " + s.quality, value: s.quality });
  const rates = [50, 80, 100, 150, 200];
  MENUS.rate = { items: rates.map((v) => ({ label: v + " Мбит/с", value: v })), current: s.max_mbit, pick: (v) => set({ max_mbit: v }) };
  if (!rates.includes(s.max_mbit)) MENUS.rate.items.push({ label: s.max_mbit + " Мбит/с", value: s.max_mbit });
  const fps = [30, 60, 120].includes(s.fps) ? [[30, "30"], [60, "60"], [120, "120"]] : [[30, "30"], [60, "60"], [120, "120"], [s.fps, String(s.fps)]];
  const about = { hevc: "HEVC — небольшие файлы, открывается в DaVinci Resolve и большинстве плееров", h264: "H.264 — открывается где угодно, но файлы крупнее", av1: "AV1 — самые маленькие файлы, но открывается не везде" }[s.codec] || "";
  return `
    <div class="row"><div class="name">Кодек</div>${seg("codec", [["hevc", "HEVC"], ["h264", "H.264"], ["av1", "AV1"]], s.codec)}</div>
    <div class="row"><div class="name">Кадров в секунду</div>${seg("fps", fps, s.fps)}</div>
    <div class="row"><div class="name">Качество</div>${popup("quality", MENUS.quality.items, s.quality)}</div>
    <div class="row"><div class="name">Предел битрейта</div>${popup("rate", MENUS.rate.items, s.max_mbit)}</div>
    <div class="note">${about}. Качество держится постоянным: в простых сценах файл маленький, в сложных (трава, дождь, частицы, резкие повороты) растёт до предела битрейта. Если в таких сценах картинка рассыпается на квадраты — поднимите предел. Сжимает видеокарта, на игры это почти не влияет.</div>`;
}

function pageSound() {
  const s = S.settings;
  const rates = [128, 192, 256, 320];
  MENUS.audio = { items: rates.map((v) => ({ label: v + " кбит/с", value: v })), current: s.audio_kbit, pick: (v) => set({ audio_kbit: v }) };
  if (!rates.includes(s.audio_kbit)) MENUS.audio.items.push({ label: s.audio_kbit + " кбит/с", value: s.audio_kbit });
  const from = s.sound_from || { type: "all" };
  const isWindow = s.source.type === "window";
  const items = [
    { label: "Весь звук компьютера", value: { type: "all" } },
    { label: "Только записываемое окно", value: { type: "source" } },
  ];
  if (S.apps.length) {
    items.push({ line: true }, { head: "Только программа" });
    for (const a of S.apps) items.push({ label: a.name, value: { type: "app", exe: a.exe, name: a.name } });
  }
  if (from.type === "app" && !S.apps.some((a) => a.exe === from.exe)) items.push({ label: from.name + " (не запущена)", value: from });
  MENUS.from = { items, current: from, pick: (v) => set({ sound_from: v }) };
  const hint = from.type === "all" ? "Всё, что играет через устройство вывода по умолчанию"
    : from.type === "source" ? (isWindow ? "Только звук программы, чьё окно записывается" : "Сейчас записывается экран, поэтому пишется весь звук. Выберите окно или программу")
    : "Только звук этой программы, даже если записывается весь экран. Discord, браузер и уведомления не попадут";
  return `
    <div class="row"><div class="name">Звук программ<small>${esc(hint)}</small></div><button class="switch ${s.system_sound ? "on" : ""}" data-toggle="system_sound"></button></div>
    <div class="row"><div class="name">Откуда звук</div>${popup("from", MENUS.from.items, from)}</div>
    <div class="row"><div class="name">Микрофон<small>Устройство записи по умолчанию</small></div><button class="switch ${s.microphone ? "on" : ""}" data-toggle="microphone"></button></div>
    <div class="row"><div class="name">Качество звука</div>${popup("audio", MENUS.audio.items, s.audio_kbit)}</div>
    <div class="note">Звук программ и микрофон пишутся отдельными дорожками: в монтаже их можно править порознь. Простые плееры играют только первую дорожку — звук программ. Если выбранная программа запустится позже, её звук подхватится сам.</div>`;
}

function keyRow(id, name) {
  const value = S.settings.hotkeys[id] || "";
  const isListening = listening === id;
  const taken = value && S.taken.includes(value);
  const text = isListening ? (partial || "Нажмите сочетание…") : (value || "Не задано");
  return `<div class="row"><div class="name">${name}${taken ? '<small class="bad">Занята другой программой</small>' : ""}</div>
    <button class="key ${isListening ? "listening" : ""} ${value ? "" : "empty"} ${taken ? "taken" : ""}" data-key="${id}">${esc(text)}</button></div>`;
}
function pageKeys() {
  return keyRow("save_clip", "Сохранить последние " + duration(S.settings.buffer_seconds))
    + keyRow("record", "Начать и остановить запись")
    + keyRow("buffer", "Включить и выключить буфер")
    + `<div class="note">Нажмите на поле, затем на сочетание клавиш. Backspace убирает сочетание, Esc — отмена. Клавиши работают в любой программе и в играх.</div>`;
}

const ICONS = {
  play: '<svg viewBox="0 0 16 16"><path d="M5 3.5v9l7.5-4.5z"/></svg>',
  folder: '<svg viewBox="0 0 16 16"><path d="M2 4.6a1.4 1.4 0 0 1 1.4-1.4h2.9l1.4 1.6h4.9a1.4 1.4 0 0 1 1.4 1.4v5.8a1.4 1.4 0 0 1-1.4 1.4H3.4A1.4 1.4 0 0 1 2 12z"/></svg>',
  rename: '<svg viewBox="0 0 16 16"><path d="M10.6 2.8l2.6 2.6-7.4 7.4H3.2v-2.6zM9 4.4l2.6 2.6"/></svg>',
  trash: '<svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>',
};
let renaming = null; // path of the file whose name is being edited

function when(ms) {
  const d = new Date(ms), now = new Date();
  const time = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  return time;
}
function dayTitle(ms) {
  const d = new Date(ms), today = new Date();
  const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((start(today) - start(d)) / 86400000);
  if (days === 0) return "Сегодня";
  if (days === 1) return "Вчера";
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: d.getFullYear() === today.getFullYear() ? undefined : "numeric" });
}
function length(secs) {
  if (!secs) return "";
  const s = Math.round(secs);
  return s < 60 ? s + " с" : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function bytes(n) {
  const mb = n / 1048576;
  return mb >= 1024 ? (mb / 1024).toFixed(1).replace(".", ",") + " ГБ" : (mb >= 10 ? Math.round(mb) : mb.toFixed(1).replace(".", ",")) + " МБ";
}

function fileRow(f) {
  const kind = f.kind === "clip" ? "Клип" : f.kind === "rec" ? "Запись" : "Видео";
  // A name Rewind gave ("2026-11-12 14-03-05 Клип") reads better as "Клип · ELDEN RING";
  // a name the user typed is shown as it is, with the program next to the time.
  const own = !/^\d{4}-\d\d-\d\d \d\d-\d\d-\d\d/.test(f.name);
  const title = own ? f.name : (f.app ? `${kind} · ${f.app}` : kind);
  const detail = [own ? f.app : "", when(f.time), length(f.secs), bytes(f.bytes)].filter(Boolean).join(" · ");
  const p = esc(f.path);
  const head = renaming === f.path
    ? `<input data-rename="${p}" value="${esc(f.name)}" aria-label="Новое имя файла" spellcheck="false">`
    : `<b title="${esc(f.name)}">${esc(title)}</b>`;
  return `<div class="file" data-file="${p}">
      <img src="thumb?p=${encodeURIComponent(f.path)}&v=${f.time}" alt="" loading="lazy" onerror="this.outerHTML='<div class=noimg></div>'">
      <div class="info">${head}<span>${esc(detail)}</span></div>
      <div class="acts">
        <button class="icon-btn" data-op="open" aria-label="Открыть: ${esc(f.name)}" title="Открыть">${ICONS.play}</button>
        <button class="icon-btn" data-op="reveal" aria-label="Показать в папке: ${esc(f.name)}" title="Показать в папке">${ICONS.folder}</button>
        <button class="icon-btn" data-op="rename" aria-label="Переименовать: ${esc(f.name)}" title="Переименовать">${ICONS.rename}</button>
        <button class="icon-btn" data-op="delete" aria-label="В корзину: ${esc(f.name)}" title="В корзину">${ICONS.trash}</button>
      </div>
    </div>`;
}

function pageFiles() {
  const s = S.settings;
  let list;
  if (!S.files) list = '<div class="empty">Загружаю…</div>';
  else if (!S.files.length) list = '<div class="empty">Здесь появятся клипы и записи.<br>Сохраните клип или начните запись.</div>';
  else {
    let day = "", rows = "";
    for (const f of S.files) {
      const d = dayTitle(f.time);
      if (d !== day) { rows += `<div class="day">${esc(d)}</div>`; day = d; }
      rows += fileRow(f);
    }
    list = `<div class="list" aria-label="Клипы и записи">${rows}</div>`;
  }
  return `${list}
    <div class="row"><div class="name">Папка<small title="${esc(S.folder)}">${esc(shortPath(S.folder, 52))}</small></div>
      <button class="push small" data-cmd="open_folder">Открыть</button>
      <button class="push small" data-cmd="pick_folder">Изменить…</button></div>
    <div class="row"><div class="name">По папкам игр и программ<small>${s.folders_by_app ? "Rewind\\ELDEN RING\\2026-11-12 14-03-05 Клип.mp4" : "Rewind\\2026-11-12 14-03-05 Клип — ELDEN RING.mp4"}</small></div><button class="switch ${s.folders_by_app ? "on" : ""}" data-toggle="folders_by_app"></button></div>`;
}

function pageSystem() {
  const s = S.settings, u = S.update, real = S.system.available;
  const about = {
    idle: "", checking: "Проверяю…", current: "Установлена последняя версия",
    ready: `Версия ${u.version} загружена и установится при следующем запуске`,
    manual: `Вышла версия ${u.version}: её нужно скачать со страницы выпуска`,
    error: "Не удалось проверить: нет связи с GitHub",
  }[u.state] || "";
  const button = u.state === "ready" ? '<button class="push small primary" data-cmd="restart_update">Перезапустить</button>'
    : u.state === "manual" ? '<button class="push small" data-cmd="open_release">Страница выпуска</button>'
    : `<button class="push small" data-cmd="check_update" ${u.state === "checking" ? "disabled" : ""}>Проверить</button>`;
  const version = `<div class="row"><div class="name">Rewind ${esc(S.version)}${about ? "<small>" + esc(about) + "</small>" : ""}</div>${real ? button : ""}</div>`;
  const log = '<div class="row"><div class="name">Журнал работы</div><button class="push small" data-cmd="open_log">Открыть</button></div>';
  const notes = `<div class="row"><div class="name">Уведомления<small>Карточка в углу экрана; в запись не попадает</small></div><button class="switch ${s.notifications ? "on" : ""}" data-toggle="notifications"></button></div>`;
  if (!real) {
    return notes + version + log + '<div class="note">Это переносная или тестовая копия со своей папкой настроек. Она не добавляет себя в меню «Пуск» и в автозапуск и сама не обновляется.</div>';
  }
  return `
    ${notes}
    <div class="row"><div class="name">Запускать вместе с Windows<small>Тихо, сразу в области уведомлений</small></div><button class="switch ${s.autostart ? "on" : ""}" data-toggle="autostart"></button></div>
    <div class="row"><div class="name">Ярлык в меню «Пуск»</div><button class="switch ${s.start_menu ? "on" : ""}" data-toggle="start_menu"></button></div>
    <div class="row"><div class="name">Обновлять автоматически<small>Проверка раз в сутки; новая версия ставится при следующем запуске</small></div><button class="switch ${s.auto_update ? "on" : ""}" data-toggle="auto_update"></button></div>
    ${version}${log}
    <div class="row"><div class="name">Убрать из системы<small>Удаляет ярлык и автозапуск. Настройки и записи остаются</small></div><button class="push small" data-cmd="remove_system">Убрать</button></div>`;
}

const PAGES = { capture: pageCapture, video: pageVideo, sound: pageSound, keys: pageKeys, files: pageFiles, system: pageSystem };

function render() {
  stale = false;
  const s = S.settings, st = S.status;
  const keep = duration(s.buffer_seconds);
  $("mark").setAttribute("class", "mark " + (st.recording ? "rec" : st.buffer_on ? "on" : ""));
  $("status").textContent = st.recording
    ? (st.buffer_on ? "Идёт запись · буфер хранит последние " + keep : "Идёт запись")
    : (st.buffer_on ? "Буфер хранит последние " + keep : "Выключен — экран не захватывается");
  $("save").textContent = "Сохранить последние " + keep;
  $("save").disabled = !st.buffer_on;
  $("record").textContent = st.recording ? "Остановить запись" : "Начать запись";
  $("record").className = "push " + (st.recording ? "stop" : "primary");
  $("buffer").className = "switch " + (st.buffer_on ? "on" : "");
  morph($("tabs"), TABS.map(([id, name]) => `<button class="${id === tab ? "on" : ""}" data-tab="${id}">${name}</button>`).join(""));
  closeMenu();
  morph($("page"), PAGES[tab]());
  describe();
}

// Updates a container to new markup in place: elements that are still there keep their
// identity, so keyboard focus stays on the switch you just pressed and screen readers and
// UI automation do not lose track of it. Only what changed is touched.
function morph(container, html) {
  const fresh = document.createElement("template");
  fresh.innerHTML = html;
  patch(container, fresh.content);
}
function patch(old, now) {
  const a = Array.from(old.childNodes), b = Array.from(now.childNodes);
  for (let i = 0; i < b.length; i++) {
    const x = a[i], y = b[i];
    if (!x) { old.appendChild(y.cloneNode(true)); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) { old.replaceChild(y.cloneNode(true), x); continue; }
    if (x.nodeType === Node.TEXT_NODE) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    if (x.nodeType !== Node.ELEMENT_NODE) continue;
    for (const attr of Array.from(x.attributes)) {
      // aria-* are filled in afterwards by describe(); keep them.
      if (!y.hasAttribute(attr.name) && !attr.name.startsWith("aria-") && attr.name !== "role") x.removeAttribute(attr.name);
    }
    for (const attr of Array.from(y.attributes)) if (x.getAttribute(attr.name) !== attr.value) x.setAttribute(attr.name, attr.value);
    if ("disabled" in x) x.disabled = y.hasAttribute("disabled");
    patch(x, y);
  }
  for (let i = a.length - 1; i >= b.length; i--) a[i].remove();
}

// Names and states for screen readers and UI automation: without them every switch is the
// same nameless button and a pop-up says "10 мин" without saying what it sets.
function describe() {
  const rowName = (el) => {
    const name = el.closest(".row")?.querySelector(".name");
    return name ? (name.firstChild?.textContent || name.textContent).trim() : "";
  };
  // Tabs stay plain buttons marked "current": with role="tab" Chromium no longer turns an
  // accessibility "invoke" into a click, and aria-pressed would present them as switches.
  $("tabs").setAttribute("aria-label", "Разделы настроек");
  for (const b of $("tabs").querySelectorAll("button")) {
    if (b.classList.contains("on")) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  }
  $("buffer").setAttribute("aria-label", "Буфер повтора");
  for (const s of document.querySelectorAll(".switch")) {
    s.setAttribute("role", "switch");
    s.setAttribute("aria-checked", s.classList.contains("on") ? "true" : "false");
    if (s.id !== "buffer") s.setAttribute("aria-label", rowName(s));
  }
  for (const p of document.querySelectorAll(".popup")) {
    // No aria-haspopup: with it Chromium offers "expand" instead of "invoke" to UI automation,
    // and that never reaches the page, so the menu could not be opened that way.
    p.setAttribute("aria-label", `${rowName(p)}: ${p.textContent.trim()}`);
  }
  for (const b of document.querySelectorAll(".seg button[data-seg]")) {
    b.setAttribute("aria-pressed", b.classList.contains("on") ? "true" : "false");
    b.setAttribute("aria-label", `${rowName(b)}: ${b.textContent.trim()}`);
  }
  for (const k of document.querySelectorAll(".key")) k.setAttribute("aria-label", `${rowName(k)}: ${k.textContent.trim()}`);
  for (const b of document.querySelectorAll(".push.small")) {
    const name = rowName(b);
    if (name && !b.hasAttribute("aria-label")) b.setAttribute("aria-label", `${name}: ${b.textContent.trim()}`);
  }
  $("close").setAttribute("aria-label", "Закрыть");
}

// ---------- events ----------
document.addEventListener("mousedown", (e) => {
  const p = e.target.closest("[data-popup]");
  if (p) { e.preventDefault(); openMenu(p); return; }   // menus open on press, like in macOS
  if (e.target.closest("#drag") && !e.target.closest("button") && e.button === 0) cmd("drag");
});
document.addEventListener("click", (e) => {
  // A pop-up opens on mouse press (above). Enter, Space, screen readers and UI automation
  // send only a click, with detail 0: open it for those too.
  const pop = e.target.closest("[data-popup]");
  if (pop) { if (e.detail === 0) openMenu(pop); return; }
  const t = e.target.closest("button");
  if (!t) { if (listening) stopListening(); return; }
  if (t.dataset.key) { startListening(t.dataset.key); return; }
  if (listening) stopListening();
  if (t.dataset.op) { fileAction(t.dataset.op, t.closest("[data-file]").dataset.file); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; if (tab === "files") cmd("files"); render(); }
  else if (t.dataset.toggle) set({ [t.dataset.toggle]: !S.settings[t.dataset.toggle] });
  else if (t.dataset.seg) set({ [t.dataset.seg]: JSON.parse(t.dataset.value) });
  else if (t.dataset.cmd) cmd(t.dataset.cmd);
  else if (t.id === "save") cmd("save");
  else if (t.id === "record") cmd("record");
  else if (t.id === "buffer") cmd("buffer");
  else if (t.id === "close") cmd("close");
});
document.addEventListener("contextmenu", (e) => e.preventDefault());

// ---------- hotkey capture ----------
const NAMES = { Backquote: "`", Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", Backslash: "\\", Semicolon: ";",
  Quote: "'", Comma: ",", Period: ".", Slash: "/", ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right",
  Space: "Space", Insert: "Insert", Delete: "Delete", Home: "Home", End: "End", PageUp: "PageUp", PageDown: "PageDown",
  PrintScreen: "PrintScreen", ScrollLock: "ScrollLock", Pause: "Pause", Tab: "Tab" };
function keyName(code) {
  let m;
  if ((m = /^Key([A-Z])$/.exec(code))) return m[1];
  if ((m = /^Digit(\d)$/.exec(code))) return m[1];
  if ((m = /^Numpad(\d)$/.exec(code))) return "Num" + m[1];
  if (/^F([1-9]|1\d|2[0-4])$/.test(code)) return code;
  return NAMES[code] || null;
}
function mods(e) { return [e.ctrlKey && "Ctrl", e.altKey && "Alt", e.shiftKey && "Shift", e.metaKey && "Win"].filter(Boolean); }
function startListening(id) { listening = id; partial = ""; cmd("hotkeys_pause"); render(); }
function stopListening() { listening = null; partial = ""; cmd("hotkeys_resume"); render(); }
function finishKey(e) {
  const m = mods(e), name = keyName(e.code);
  if (!name) { partial = m.length ? m.join("+") + "+…" : ""; render(); return; }
  // A bare letter or digit would fire while typing; such keys need a modifier.
  const standalone = /^F\d+$/.test(name) || ["PrintScreen", "ScrollLock", "Pause", "Insert"].includes(name);
  if (!m.length && !standalone) { partial = "Добавьте Ctrl, Alt или Shift"; render(); return; }
  const id = listening;
  listening = null; partial = "";
  S.settings.hotkeys = Object.assign({}, S.settings.hotkeys, { [id]: m.concat(name).join("+") });
  send({ t: "set", settings: { hotkeys: S.settings.hotkeys } });
  cmd("hotkeys_resume"); render();
}
document.addEventListener("keydown", (e) => {
  if (!listening) { if (e.key === "Escape") { if ($("menu")) closeMenu(); else cmd("close"); } return; }
  e.preventDefault();
  if (e.key === "Escape") { stopListening(); return; }
  if (e.key === "Backspace" && !mods(e).length) {
    const id = listening; listening = null;
    S.settings.hotkeys = Object.assign({}, S.settings.hotkeys, { [id]: "" });
    send({ t: "set", settings: { hotkeys: S.settings.hotkeys } });
    cmd("hotkeys_resume"); render(); return;
  }
  finishKey(e);
}, true);
// PrintScreen only reports its release.
document.addEventListener("keyup", (e) => { if (listening && e.code === "PrintScreen") { e.preventDefault(); finishKey(e); } }, true);
window.addEventListener("blur", () => { closeMenu(); if (listening) stopListening(); });

function fileAction(op, path) {
  if (op === "rename") {
    renaming = path; render();
    const field = document.querySelector("[data-rename]");
    if (field) { field.focus(); field.select(); }
    return;
  }
  send({ t: "file", op, path });
}
function finishRename(field, keep) {
  const path = field.dataset.rename, name = field.value.trim();
  renaming = null;
  const old = (S.files || []).find((f) => f.path === path);
  if (keep && name && old && name !== old.name) send({ t: "file", op: "rename", path, name });
  render();
}
document.addEventListener("keydown", (e) => {
  const field = e.target.closest && e.target.closest("[data-rename]");
  if (!field) return;
  if (e.key === "Enter") { e.preventDefault(); finishRename(field, true); }
  else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finishRename(field, false); }
}, true);
document.addEventListener("focusout", (e) => {
  if (e.target.dataset && e.target.dataset.rename && renaming) finishRename(e.target, true);
});
document.addEventListener("dblclick", (e) => {
  const row = e.target.closest("[data-file]");
  if (row && !e.target.closest("button, input")) fileAction("open", row.dataset.file);
});

window.rewind = {
  files(list) { S.files = list; if (tab === "files" && !renaming) { if ($("menu") || listening) stale = true; else render(); } },
  update(state) {
    Object.assign(S, state);
    if (listening || $("menu")) stale = true;
    else render();
  },
  // Test aid: switch the page from outside.
  show(name) { tab = name; if (tab === "files") cmd("files"); render(); },
};
render();
send({ t: "ready" });
</script>
</body>
</html>
